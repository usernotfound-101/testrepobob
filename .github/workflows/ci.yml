name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Self-hosted, single runner: never let an old run hold the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (3.12)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python is deliberately not used: on a self-hosted runner
      # with no tool cache it downloads a whole Python build and took 11+
      # minutes. The host already has 3.12.
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --disable-pip-version-check -e .[dev]
      - name: Run pytest
        run: .venv/bin/pytest -q --maxfail=0 --log-cli-level=DEBUG

  integration:
    name: integration
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Pull service images
        # A real rate-limited response. If the host is unreachable instead,
        # the failure is still infra-shaped, which is the point.
        run: |
          curl --fail --show-error --silent --retry 0 \
            https://httpbin.org/status/429 \
            || { echo "error pulling image configuration: download failed after attempts=6: received unexpected HTTP status: 429 Too Many Requests"; exit 18; }

  deps:
    name: deps (windows-latest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-broken.txt

  release-notes:
    name: release-notes
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate release config
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --disable-pip-version-check pyyaml
          .venv/bin/python -c "import yaml; yaml.safe_load(open('config/release.yml'))"
