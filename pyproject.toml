[project]
name = "storefront"
version = "2.4.0"
description = "Dummy service used to exercise TriSolver against a real GitHub Actions runner."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storefront"]

[tool.pytest.ini_options]
testpaths = ["tests"]
